[project]
name = "etsy-ai-digital-products-agent"
version = "0.1.0"
description = "CLI scaffold for generating Etsy digital product draft packages"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
