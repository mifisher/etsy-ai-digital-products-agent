# Example configuration. Copy to config/lanes.yml and fill in your own values.
#   cp config/lanes.example.yml config/lanes.yml
# config/lanes.yml is gitignored — it holds your real shop id and niche strategy.

shop_id: "YOUR_ETSY_SHOP_ID"

# Seed lanes: the niches the radar researches each run.
# `credibility` (0-1) is how believable YOUR listing copy would be in that niche —
# a human judgement, deliberately not asked of the LLM.
# `brand_fit` routes the result: your existing shop, or a suggestion to open a new one.
lanes:
  - id: example-niche-one
    keywords: ["example keyword", "second example keyword"]
    credibility: 0.9
    brand_fit: my_shop
  - id: example-niche-two
    keywords: ["another example keyword"]
    credibility: 0.4
    brand_fit: new_shop

# Scoring weights. Each group must sum to 1.0.
weights:
  quantitative: {demand: 0.40, gap: 0.40, price: 0.20}
  qualitative:
    pain_urgency: 0.30
    willingness_to_pay: 0.30
    differentiation: 0.25
    credibility: 0.15
  final: {quantitative: 0.45, qualitative: 0.35, ease_to_create: 0.20}

# Verdict cutoffs applied to the final score.
thresholds:
  pursue: 0.65
  maybe: 0.40

limits:
  search_limit: 20
  reject_cooldown_days: 30
